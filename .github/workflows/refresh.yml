name: Refresh data and dashboard

# Live dashboard: once a day, pull every public source again, rebuild the
# charts, dashboard and EVIDENCE.md, and commit the new snapshot. GitHub
# Pages serves /docs, so the dashboard updates itself.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch live data and rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m near_thesis run
      - run: python -m pytest -q
      - name: Commit refreshed snapshot
        run: |
          git config user.name "near-thesis-bot"
          git config user.email "near-thesis-bot@users.noreply.github.com"
          git add data/snapshot docs EVIDENCE.md
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git push
